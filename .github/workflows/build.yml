name: build

on:
  push:
  pull_request:

jobs:
  test-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ hashFiles('tools/godot_version.txt') }}

      - name: Install Godot
        run: |
          tools/install_godot.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Import project
        run: godot --headless --path . --import

      - name: Validate data
        run: |
          if [ -f tools/validate_data.gd ]; then
            godot --headless --path . -s tools/validate_data.gd
          fi

      - name: Run tests
        run: tools/test.sh

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/OpenWorldRemake.exe
          test -s build/windows/OpenWorldRemake.exe

      - uses: actions/upload-artifact@v4
        with:
          name: OpenWorldRemake-windows
          path: build/windows/
          retention-days: 30
